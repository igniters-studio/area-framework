name: Registry

# Validates the registry and checks the npm package (package/) on every pull request: generated
# types, tests, validator, build, then the packed tarball itself, as npm will publish it.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      # npm pack keeps package.json as is, but npm publish silently rewrites what it finds invalid
      # (a bin it cannot read is dropped): fail here rather than ship a broken package.
      - name: Publish dry run, without corrections from npm
        run: |
          npm publish --dry-run 2>&1 | tee publish.log
          if grep -q 'auto-corrected' publish.log; then
            echo "::error::npm publish would rewrite package.json: run npm pkg fix in package/"
            exit 1
          fi
      - name: Validate the registry with the packed package
        run: |
          npm pack
          npx --yes --package "$PWD/area-framework-$(node -p 'require("./package.json").version').tgz" area-framework validate ../registry
