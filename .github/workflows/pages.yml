name: Pages

# Builds the site (site/, a Next.js static export) and publishes it on GitHub Pages at
# https://igniters-studio.github.io/area-framework/. On this organization's plan, Pages serves
# public repositories only: while the repo is private, both jobs are skipped.
# The release job tags and releases each new registry version, whatever the visibility.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tags and releases the registry's version the first time it reaches main, from its changelog
  # section, before the site is built: llms.txt links to the registry at that tag.
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag and release the registry version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^area_version: //p' registry/pillars.yaml)
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" { f = 1; next } /^## \[/ { if (f) exit } f' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "AREA $version" --notes-file notes.md --latest

  build:
    needs: release
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
